<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#302d43"><title>月光森林｜故事拼圖</title><link rel="stylesheet" href="./style.css"></head>
