<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 160" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1b0"/>
      <stop offset="35%" stop-color="#f5c842"/>
      <stop offset="75%" stop-color="#c98a12"/>
      <stop offset="100%" stop-color="#7a4e05"/>
    </linearGradient>
    <radialGradient id="key-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe680" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f3a712" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f3a712" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Golden shimmer aura -->
  <circle cx="65" cy="75" r="50" fill="url(#key-glow)"/>

  <!-- Ground contact shadow -->
  <ellipse cx="65" cy="148" rx="26" ry="6" fill="#141a24" opacity="0.6"/>

  <!-- Classic ornate antique key, angled slightly with mysterious ribbon -->
  <g transform="rotate(-20 65 80)">
    <!-- Silk ribbon tied to the bow -->
    <path d="M65 30 C58 20 40 18 36 28 C32 38 48 42 56 36 L62 34 Z" fill="#b9333a" stroke="#68151a" stroke-width="1.5"/>
    <path d="M65 30 C72 20 90 18 94 28 C98 38 82 42 74 36 L68 34 Z" fill="#d4454d" stroke="#68151a" stroke-width="1.5"/>
    <!-- Ribbon tails -->
    <path d="M60 35 Q45 50 48 65 Q54 62 58 52 Q62 42 63 36 Z" fill="#9e2229"/>
    <path d="M68 35 Q76 48 82 62 Q76 60 72 50 Q67 42 66 36 Z" fill="#b9333a"/>

    <!-- Key Bow (Ornate Clover / Heart shape) -->
    <circle cx="65" cy="38" r="18" fill="url(#gold)" stroke="#664003" stroke-width="2.5"/>
    <circle cx="65" cy="38" r="9" fill="#1b233a" stroke="#664003" stroke-width="2"/>
    <!-- Decorative clover lobes -->
    <circle cx="65" cy="22" r="5" fill="url(#gold)" stroke="#664003" stroke-width="1.5"/>
    <circle cx="51" cy="38" r="5" fill="url(#gold)" stroke="#664003" stroke-width="1.5"/>
    <circle cx="79" cy="38" r="5" fill="url(#gold)" stroke="#664003" stroke-width="1.5"/>

    <!-- Key Stem / Shaft -->
    <rect x="61" y="54" width="8" height="66" rx="2" fill="url(#gold)" stroke="#664003" stroke-width="2"/>
    <!-- Decorative collar rings on stem -->
    <rect x="58" y="58" width="14" height="4" rx="2" fill="#fff3b8" stroke="#664003" stroke-width="1"/>
    <rect x="59" y="70" width="12" height="3" rx="1.5" fill="#fff3b8" stroke="#664003" stroke-width="1"/>
    <!-- Key tip bead -->
    <circle cx="65" cy="122" r="4" fill="url(#gold)" stroke="#664003" stroke-width="1.5"/>

    <!-- Key Bit (Cuts & notches) -->
    <path d="M69 98 h16 v18 h-6 v-4 h-4 v4 h-6 z" fill="url(#gold)" stroke="#664003" stroke-width="2"/>
    <!-- Star-shaped key cut hole -->
    <rect x="74" y="103" width="4" height="4" fill="#1b233a"/>
  </g>

  <!-- Sparkles -->
  <polygon points="26,45 28,40 33,38 28,36 26,31 24,36 19,38 24,40" fill="#fff6be"/>
  <polygon points="106,90 108,86 112,84 108,82 106,78 104,82 100,84 104,86" fill="#fff6be"/>
</svg>
