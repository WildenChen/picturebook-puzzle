<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" width="100%" height="100%">
  <defs>
    <linearGradient id="book-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d4a6b"/>
      <stop offset="50%" stop-color="#1e324a"/>
      <stop offset="100%" stop-color="#111c2a"/>
    </linearGradient>
    <linearGradient id="book-pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8d8be"/>
      <stop offset="50%" stop-color="#fff8eb"/>
      <stop offset="100%" stop-color="#e8d8be"/>
    </linearGradient>
    <radialGradient id="book-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8a3" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#caa048" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#caa048" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mysterious storybook glow -->
  <circle cx="80" cy="80" r="54" fill="url(#book-glow)"/>

  <!-- Shadow -->
  <ellipse cx="80" cy="136" rx="46" ry="8" fill="#141a24" opacity="0.6"/>

  <!-- Open hardbound storybook with gilded edges -->
  <!-- Back cover edges visible underneath -->
  <path d="M18 108 C46 112 76 115 80 125 C84 115 114 112 142 108 L144 114 C116 118 84 122 80 130 C76 122 44 118 16 114 Z" fill="#8c6832" stroke="#4a3617" stroke-width="1.5"/>

  <!-- Thick block of aged parchment pages -->
  <path d="M22 100 C48 104 76 107 80 118 C84 107 112 104 138 100 L140 108 C114 112 84 115 80 125 C76 115 46 112 20 108 Z" fill="#d9c39e"/>

  <!-- Open Pages Left & Right -->
  <!-- Left Page -->
  <path d="M22 62 C46 54 74 58 80 72 L80 118 C74 106 46 102 22 102 Z" fill="url(#book-pages)" stroke="#8c7757" stroke-width="1.5"/>
  <!-- Right Page -->
  <path d="M138 62 C114 54 86 58 80 72 L80 118 C86 106 114 102 138 102 Z" fill="url(#book-pages)" stroke="#8c7757" stroke-width="1.5"/>

  <!-- Curving text lines and fairy tale illustration on the pages -->
  <!-- Left Page: Ancient runes / story lines -->
  <line x1="32" y1="74" x2="70" y2="72" stroke="#9e8563" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="82" x2="68" y2="80" stroke="#9e8563" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="90" x2="66" y2="88" stroke="#9e8563" stroke-width="2" stroke-linecap="round"/>
  <!-- Decorative drop capital letter -->
  <rect x="32" y="70" width="8" height="8" rx="1.5" fill="#a83939"/>

  <!-- Right Page: Illustrated crescent moon & star on the page -->
  <path d="M112 74 A 8 8 0 0 0 116 88 A 10 10 0 1 1 112 74 Z" fill="#caa048"/>
  <circle cx="124" cy="74" r="1.5" fill="#caa048"/>
  <line x1="90" y1="94" x2="128" y2="92" stroke="#9e8563" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="100" x2="124" y2="98" stroke="#9e8563" stroke-width="2" stroke-linecap="round"/>

  <!-- Center spine ribbon bookmark -->
  <path d="M80 70 Q76 95 86 128 L80 124 L74 128 Q72 95 80 70 Z" fill="#b9333a" stroke="#68151a" stroke-width="1"/>

  <!-- Magical sparkles floating out from the book -->
  <polygon points="80,44 82,38 88,36 82,34 80,28 78,34 72,36 78,38" fill="#ffe999"/>
  <polygon points="54,36 55,32 59,30 55,28 54,24 53,28 49,30 53,32" fill="#ffe999"/>
  <polygon points="108,38 109,34 113,32 109,30 108,26 107,30 103,32 107,34" fill="#ffe999"/>
</svg>
