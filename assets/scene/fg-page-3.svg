<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <!-- Left majestic tree framing clearing -->
  <path d="M-20 450 L-20 120 Q50 160 80 240 Q110 200 130 140 Q110 240 100 340 Q130 330 150 450 Z" fill="#0b111a"/>
  <!-- Foliage clouds -->
  <ellipse cx="60" cy="140" rx="70" ry="45" fill="#090e15"/>
  <ellipse cx="120" cy="170" rx="50" ry="35" fill="#0b111a"/>

  <!-- Right ancient tree framing clearing -->
  <path d="M820 450 L820 140 Q760 170 720 240 Q690 200 670 140 Q690 240 700 340 Q670 330 650 450 Z" fill="#0b111a"/>
  <ellipse cx="740" cy="140" rx="70" ry="45" fill="#090e15"/>
  <ellipse cx="680" cy="170" rx="50" ry="35" fill="#0b111a"/>

  <!-- Top overarching branches meeting at top edges -->
  <path d="M0 0 Q200 50 300 15 Q150 5 0 0 Z" fill="#090e15"/>
  <path d="M800 0 Q600 50 500 15 Q650 5 800 0 Z" fill="#090e15"/>

  <!-- Foreground flower meadows -->
