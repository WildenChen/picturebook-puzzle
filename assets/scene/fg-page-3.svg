  <!-- Night-blooming magical star flowers in foreground -->
  <g fill="#ffeaa7">
    <!-- Flower 1 -->
    <circle cx="210" cy="425" r="2.5"/><circle cx="206" cy="423" r="2"/><circle cx="214" cy="423" r="2"/>
    <circle cx="208" cy="428" r="2"/><circle cx="212" cy="428" r="2"/><circle cx="210" cy="425" r="1.5" fill="#ff7675"/>
    <!-- Flower 2 -->
    <circle cx="340" cy="430" r="2.5"/><circle cx="336" cy="428" r="2"/><circle cx="344" cy="428" r="2"/>
    <circle cx="338" cy="433" r="2"/><circle cx="342" cy="433" r="2"/><circle cx="340" cy="430" r="1.5" fill="#74b9ff"/>
    <!-- Flower 3 -->
    <circle cx="620" cy="428" r="2.5"/><circle cx="616" cy="426" r="2"/><circle cx="624" cy="426" r="2"/>
    <circle cx="618" cy="431" r="2"/><circle cx="622" cy="431" r="2"/><circle cx="620" cy="428" r="1.5" fill="#ff7675"/>
  </g>

  <!-- Abundant glowing magical motes floating around the altar -->
  <circle cx="490" cy="270" r="2.5" fill="#ffeaa7" opacity="0.9"/>
  <circle cx="490" cy="270" r="8" fill="#ffeaa7" opacity="0.3"/>
  <circle cx="535" cy="290" r="2" fill="#ffeaa7" opacity="0.85"/>
  <circle cx="535" cy="290" r="6" fill="#ffeaa7" opacity="0.25"/>
  <circle cx="440" cy="305" r="2" fill="#ffeaa7" opacity="0.8"/>
  <circle cx="360" cy="330" r="2" fill="#ffeaa7" opacity="0.75"/>
  <circle cx="280" cy="370" r="2" fill="#ffeaa7" opacity="0.85"/>
