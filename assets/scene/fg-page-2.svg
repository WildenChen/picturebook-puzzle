<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <!-- Top leafy canopy framing tree crown -->
  <ellipse cx="520" cy="20" rx="200" ry="60" fill="#0b111a"/>
  <ellipse cx="260" cy="50" rx="130" ry="50" fill="#0d141e"/>
  <ellipse cx="720" cy="60" rx="140" ry="55" fill="#0b111a"/>

  <!-- Left foreground ivy and ferns -->
  <path d="M-10 450 L-10 320 Q40 330 65 375 Q95 360 120 450 Z" fill="#0d141e"/>
  <!-- Fern fronds left -->
  <path d="M20 440 Q50 380 90 370 Q70 405 55 440" fill="#131e2b"/>
  <path d="M60 445 Q90 390 135 385 Q115 415 95 445" fill="#131e2b"/>

  <!-- Rolling ground contour in front of tree base -->
  <path d="M-20 450 Q200 420 440 430 T820 425 L820 450 Z" fill="#0b111a"/>

  <!-- Ground cover mushrooms and glowing spore motes -->
  <ellipse cx="610" cy="430" rx="8" ry="5" fill="#caa048"/>
  <rect x="608" y="430" width="3.5" height="10" fill="#fff5dd"/>
  <ellipse cx="630" cy="435" rx="6" ry="4" fill="#a43232"/>
  <rect x="628" y="435" width="3" height="8" fill="#fff5dd"/>

  <!-- Spores floating around tree hollow -->
  <circle cx="485" cy="290" r="2.5" fill="#ffeaa7" opacity="0.8"/>
  <circle cx="485" cy="290" r="6" fill="#ffeaa7" opacity="0.25"/>
  <circle cx="530" cy="330" r="2" fill="#ffeaa7" opacity="0.9"/>
  <circle cx="530" cy="330" r="5" fill="#ffeaa7" opacity="0.3"/>
  <circle cx="360" cy="260" r="1.5" fill="#ffeaa7" opacity="0.75"/>
  <circle cx="210" cy="340" r="2" fill="#ffeaa7" opacity="0.85"/>
</svg>
