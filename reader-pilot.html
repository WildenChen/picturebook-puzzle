<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171c30">
  <meta name="description" content="彼得潘｜貼紙童話試作（共用閱讀引擎預覽）。">
  <title>彼得潘｜貼紙童話試作｜共用閱讀引擎</title>
  <link rel="stylesheet" href="./src/player/reader.css?v={{ site.github.build_revision }}">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a href="./" class="back" aria-label="返回故事書架">‹ <span>返回書架</span></a>
      <div class="brand"><span class="star">✦</span><span>共用閱讀引擎 <small>SHARED READER</small></span></div>
      <button id="resetPage" class="muted" type="button">重設本頁</button>
    </header>
    <div class="book-heading">
      <p class="eyebrow">SHARED RUNTIME · PILOT PREVIEW</p>
      <h1>彼得潘 <span>貼紙童話試作</span></h1>
      <p>以 Book Package 驅動的共用閱讀引擎預覽，與舊版入口並存。</p>
    </div>
    <div class="chapter-nav" id="chapterNav" aria-label="頁面導覽"></div>
    <div class="workspace">
      <main class="reading-book" id="reader">
        <div class="page-head">
          <span id="chapterLabel">第一章</span>
          <span id="readingProgress" aria-live="polite">第 1 / 3 頁</span>
        </div>
        <section class="story-copy" aria-label="故事正文">
          <div class="story-eyebrow" id="pageChapter"></div>
          <h2 id="pageTitle"></h2>
          <div id="storyText" class="story-text"></div>
          <p id="storyNote" class="story-note" role="status" aria-live="polite"></p>
        </section>
        <div class="stage-shell">
          <div id="stage" class="stage" aria-label="互動故事插畫，選取貼紙後點這裡放入" tabindex="0">
            <img id="sceneImage" class="scene-background" alt="故事場景插畫" />
            <div class="stage-wash" aria-hidden="true"></div>
            <div id="stageActors" class="stage-actors"></div>
            <span class="stage-help" id="stageHelp">選擇貼紙，再放進場景</span>
          </div>
        </div>
        <div class="reading-controls">
          <button id="prevPage" type="button">← 上一頁</button>
          <button id="nextPage" type="button">下一頁 →</button>
        </div>
        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
      </main>
      <aside class="toolbox" aria-label="故事貼紙">
        <div class="toolbox-top"><div><span class="tiny">STICKER TRAY</span><h3>故事貼紙</h3></div><span id="stickerCount" class="count"></span></div>
        <p class="toolbox-help">選貼紙後點選場景的放置區；再次點選已放入的貼紙可取下。</p>
        <div id="stickerTray" class="sticker-tray"></div>
        <div class="clue-box"><span>✧ 這一頁的線索</span><p id="pageClue"></p></div>
        <div class="completion"><div><span>全書事件進度</span><b id="completeCount">0 / 3</b></div><div class="meter"><div id="meterFill"></div></div></div>
        <button id="resetBook" class="reset-book" type="button">清除整本書的進度</button>
      </aside>
    </div>
    <footer>根據 J. M. Barrie《Peter and Wendy》（1911）改編 · 共用閱讀引擎預覽</footer>
  </div>
  <script src="./src/shared/json-schema.js"></script>
  <script src="./src/shared/book-validator.js"></script>
  <script src="./src/shared/asset-safety.js"></script>
  <script src="./src/core/rule-evaluator.js"></script>
  <script src="./src/core/variant-resolver.js"></script>
  <script src="./src/core/state-machine.js"></script>
  <script src="./src/player/save-adapter.js"></script>
  <script src="./src/player/narrative-renderer.js"></script>
  <script src="./src/player/reader.js"></script>
  <script>
    fetch("./books/peterpan-sticker-pilot/book.json")
      .then((response) => {
        if (!response.ok) throw new Error("載入封包失敗：HTTP " + response.status);
        return response.json();
      })
      .then((book) => {
        window.SharedReader.start(book);
      })
      .catch((error) => {
        const note = document.getElementById("storyNote");
        if (note) note.textContent = "無法載入書籍封包：" + error.message;
      });
  </script>
</body>
</html>
